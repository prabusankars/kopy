[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kopy"
version = "0.1.0"
description = "Robust, fast robocopy-style file copier tuned for network share -> USB secure drive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []   # standard library only

[project.optional-dependencies]
fast-hash = ["blake3>=0.4"]   # used automatically for --verify when installed
dev = ["pytest>=7"]

[project.scripts]
kopy = "kopy.__main__:main"

[tool.setuptools]
packages = ["kopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
